[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "1.3.29"
description = "Production algorithmic trading system with Smart Money Concepts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Trading System Team" }]
keywords = ["trading", "algorithmic", "crypto", "binance", "smart-money"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: ",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # This project is deliberately unpinned (see CHANGELOG.md "Fixed
    # broken pyproject.toml pushed directly to main" for the explicit
    # decision to leave it that way) — do NOT reflexively add lower
    # bounds to everything below.
    #
    # The exceptions are the packages with an *open Dependabot alert
    # right now*: their lower bound is pinned to the exact version that
    # closes every currently-known CVE for that package (computed from
    # `GET /repos/{owner}/{repo}/dependabot/alerts`, not guessed), and
    # requirements.txt carries the matching pin. This is a targeted,
    # per-CVE fix, not a reversal of the unpinned-by-default policy —
    # see CHANGELOG.md "Targeted re-pin of the 9 packages with open
    # Dependabot alerts" for the full alert-by-alert justification.
    # If Dependabot later reports these packages clean, the bound can
    # be dropped again; if a *new* alert opens against an unpinned
    # package below, add a bound the same way rather than pinning
    # everything preemptively.
    "aiohttp>=3.14.3",
    "asyncpg",
    "cryptography>=49.0.0",
    "numpy",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-dotenv>=1.2.2",
    "PyYAML",
    "redis",
    "scikit-learn>=1.5.0",
    "scipy",
    "sqlalchemy[asyncio]",
    "structlog",
    "websockets",
    "aioredis",
    "alembic",
    "httpx",
    "tenacity",
    "prometheus-client",
    "pytz",
    "orjson>=3.11.6",
    "msgpack>=1.2.1",
    "uvloop",
    "click",
    "rich",
    "tabulate",
    "matplotlib",
    "seaborn",
    "joblib",
    "optuna",
    "xgboost",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-xdist",
    "hypothesis",
    "factory-boy",
    "freezegun",
    "respx",
    # Real (in-memory) async SQLite for src/persistence/ tests.
    "aiosqlite",
    "mypy",
    "ruff",
    "black>=26.3.1",
    "isort",
    "pre-commit",
    "bandit",
    "safety",
    "types-PyYAML",
    "types-pytz",
    "types-redis",
]

[project.scripts]
trading-system = "src.main:main"
trading-backtest = "scripts.backtest:main"
trading-optimize = "scripts.optimize:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
# py312 is the minimum supported runtime (requires-python >=3.12).
# ruff 0.4.x does not accept "py313"; newer ruff does — keep py312 so
# both the pinned and upgraded toolchains parse this file.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "COM",
    "C4", "DTZ", "ISC", "ICN", "G", "PIE", "PYI", "RET", "SIM",
    "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY",
    "RUF",
]
ignore = [
    "S101",      # assert used in tests / intentional
    "COM812",    # trailing-comma conflicts with formatter
    "ISC001",    # conflicts with ruff formatter
    # Style noise that dominates a large pre-existing codebase; tighten later
    "ANN101",    # missing self annotation
    "ANN102",    # missing cls annotation
    "ANN401",    # Any is used intentionally at boundaries
    "TCH001",    # type-checking import moves (optional style)
    "TCH002",
    "TCH003",
    "TRY003",    # long exception messages
    "TRY300",
    "TRY301",
    "TRY400",
    "TRY401",
    "PLR2004",   # magic values
    "PLR0911",
    "PLR0913",   # too many arguments
    "PLR0915",   # too many statements
    "PLR0912",   # too many branches
    "E501",      # line length — black/ruff format handle layout
    "E741",      # ambiguous name l (liquidity / level shorthand)
    "ARG001",
    "ARG002",
    "N802",
    "N803",
    "N806",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM117",
    "C408",
    "RET504",
    "RET505",
    "PYI041",
    "PYI034",
    "ERA001",
    "RUF001",    # ambiguous unicode in strings (× used deliberately)
    "RUF002",
    "RUF003",
    "RUF006",
    "S104",      # bind 0.0.0.0 intentional in server configs
    "S110",
    "S310",
    "B007",
    "UP040",
]

unfixable = ["ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "PLR2004", "ARG", "N806", "N803", "B017", "SLF001", "RUF100"]
"scripts/*" = ["ANN", "T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring external services",
    "slow: Tests taking more than 1 second",
    "exchange: Tests requiring exchange connectivity",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiohttp",
    "ignore::DeprecationWarning:asyncpg",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "scripts"]
